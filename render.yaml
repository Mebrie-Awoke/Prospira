services:
  - type: web
    name: prospira-api
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health/
    autoDeployTrigger: commit
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: prospira-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "openai/gpt-oss-120b"
      - key: PORT
        value: "10000"
    disk:
      name: prospira-media
      mountPath: /app/backend/media
      sizeGB: 1

databases:
  - name: prospira-db
    databaseName: prospira
    user: prospira
    plan: 0.5c-1g
    region: frankfurt
